<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Convertir Imágenes a PDF</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#228B22">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            margin-top: 30px;
            background-color: forestgreen;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #preview img {
            max-width: 150px;
            margin: 5px;
            border: 1px solid #ccc;
        }

        .button-container {
            margin-top: 20px;
        }

        .button {
            position: relative;
            border: none;
            background: transparent;
            padding: 0;
            outline: none;
            cursor: pointer;
            font-family: sans-serif;
        }

        .button .shadow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 8px;
            transform: translateY(2px);
            transition: transform 600ms cubic-bezier(0.3, 0.7, 0.4, 1);
        }

        .button .edge {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 8px;
            background: linear-gradient(to left, hsl(217, 33%, 16%) 0%, hsl(217, 33%, 32%) 8%, hsl(217, 33%, 32%) 92%, hsl(217, 33%, 16%) 100%);
        }

        .button .front {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 28px;
            font-size: 1.25rem;
            color: white;
            background: hsl(217, 33%, 17%);
            border-radius: 8px;
            transform: translateY(-4px);
            transition: transform 600ms cubic-bezier(0.3, 0.7, 0.4, 1);
        }

        .button:hover .shadow {
            transform: translateY(4px);
            transition: transform 250ms;
        }

        .button:hover .front {
            transform: translateY(-6px);
            transition: transform 250ms;
        }

        .button:active .shadow {
            transform: translateY(1px);
            transition: transform 34ms;
        }

        .button:active .front {
            transform: translateY(-2px);
            transition: transform 34ms;
        }

        .button .front span {
            user-select: none;
        }

        input[type="file"] {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f9f9f9;
        }

        #loading {
            display: none;
            margin-top: 20px;
            font-style: italic;
            color: white;
        }
    </style>
</head>

<body>
    <h1>Convertir Fotos a PDF</h1>
    <input type="file" accept="image/*" multiple onchange="handleFiles(this.files)" />
    <div id="preview"></div>
    <div class="button-container">
        <button class="button" onclick="convertToPDF()">
            <span class="shadow"></span>
            <span class="edge"></span>
            <span class="front">📄 Crear PDF</span>
        </button>
    </div>
    <div id="loading">Generando PDF...</div>
    <script>
        let imageFiles = [];
        const loadingDiv = document.getElementById("loading");
        const convertButton = document.querySelector('.button');
        function handleFiles(files) {
            imageFiles = Array.from(files);
            const preview = document.getElementById("preview");
            preview.innerHTML = "";
            imageFiles.forEach(file => {
                const reader = new FileReader();
                reader.onload = e => {
                    const img = document.createElement("img");
                    img.src = e.target.result;
                    preview.appendChild(img);
                };
                reader.readAsDataURL(file);
            });
        }
        async function convertToPDF() {
            if (imageFiles.length === 0) {
                alert("Por favor, selecciona al menos una imagen.");
                return;
            }
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF();
            loadingDiv.style.display = "block";
            convertButton.disabled = true;
            try {
                for (let i = 0; i < imageFiles.length; i++) {
                    const imgData = await readFileAsDataURL(imageFiles[i]);
                    const img = new Image();
                    img.src = imgData;
                    await new Promise(resolve => img.onload = resolve);
                    const ratio = img.width / img.height;
                    const width = 210;
                    const height = width / ratio;
                    if (i > 0) pdf.addPage();
                    pdf.addImage(imgData, 'JPEG', 0, 0, width, height);
                }
                pdf.save("imagenes.pdf");
            } catch (error) {
                console.error("Error al generar el PDF:", error);
                alert("Ocurrió un error al generar el PDF.");
            } finally {
                loadingDiv.style.display = "none";
                convertButton.disabled = false;
            }
        }
        function readFileAsDataURL(file) {
            return new Promise(resolve => {
                const reader = new FileReader();
                reader.onload = e => resolve(e.target.result);
                reader.readAsDataURL(file);
            });
        }
    </script>
</body>

</html>
